<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عالم الزوز — El Zozzz</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #030712;
      color: #f59e0b;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #334155;
      border-bottom-color: #f59e0b;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Redirect immediately to online server
    window.location.href = "https://elzozzz.vercel.app";
  </script>
</head>
<body>
  <div class="loader"></div>
  <h2>جاري تحميل عالم الزوز... ⚽💥</h2>
</body>
</html>
