name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release El-Zoz APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK & Prepare Asset
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/elzozzz.apk
          mkdir -p public/downloads
          cp dist-apk/elzozzz.apk public/downloads/elzozzz.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elzozzz-apk
          path: dist-apk/elzozzz.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "عالم الزوز — تطبيق الأندرويد الرسمي"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## ⚽ تطبيق عالم الزوز (El-Zoz) الرسمي للأندرويد
            
            أهلاً بكم في تطبيق **عالم الزوز (El Zozzz)** للكابتن زين!
            
            ### 🔥 مميزات التطبيق:
            - ملعب الزوز ومباراة ضربات الجزاء السوبر وصواريخ في المقص!
            - حلبة تكسير ودغدغة العربيات والوحش الكاسر!
            - دي جي ومهرجانات الزوز وسارينات الملاعب!
            - تحدي التكسير السريع للمشاكسين!
            - نادي الزوز السري بكود zoz.
            
            ### 📲 طريقة التثبيت:
            1. اضغط على رابط التحميل بالأسفل `elzozzz.apk`.
            2. افتح الملف واختر **تثبيت (Install)**.
          files: dist-apk/elzozzz.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push APK to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/downloads/elzozzz.apk
          git commit -m "chore(apk): update official elzozzz.apk build [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
